name: Publicacion de evidencia final conservada

"on":
  push:
    branches: [dev-jon]
    paths: ['.github/workflows/final-holdout.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: test-final-emal-d6f05d11
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar codigo publicado antes de incorporar artefactos
        run: |
          mkdir -p evidencia_publicacion
          python -m pip install -r requirements-ci.txt
          python -m pip check
          python -m pytest tests/ -q --junitxml=evidencia_publicacion/tests.xml
          python scripts/sync_sources.py --check
      - name: Recuperar resultados finales conservados sin volver a puntuar
        uses: actions/download-artifact@v4
        with:
          name: evaluacion-final-emal
          run-id: 42858124305
          github-token: ${{ github.token }}
          path: .
      - name: Verificar hashes, procedencia y privacidad sobre bytes originales
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root = Path.cwd()
          out = root/'entrega_ml'
          result = json.loads((out/'resultados/test_final.json').read_text())
          assert result == json.loads((root/'docs/TEST_FINAL_EMAL.json').read_text())
          assert result['evaluaciones'] == 1 and result['n_test'] == 92
          assert result['sha256_modelo'] == 'd6f05d11fa6002de53ecaff671b697bd901f63f946b87cc7484701aea76c210a'
          assert result['sha256_test'] == 'f1520fc0580fee119b031252538961e5d62eee68db6a0783c3a5384bc5a65011'
          for name,key in [('models/best_model.joblib','sha256_modelo'),('data/test.csv','sha256_test')]:
              assert hashlib.sha256((out/name).read_bytes()).hexdigest() == result[key]
          origin = json.loads((root/'evidencia_final/evaluacion.json').read_text())
          assert origin['run'] == '42858124305' and origin['modelo_modificado'] is False
          assert origin['reapertura_sin_reevaluacion'] is True
          capture = json.loads((root/'data/capturas_oficiales/manifest.json').read_text())
          for source in capture['fuentes']:
              if source['estado'] == 'descargado':
                  data = (root/'data/capturas_oficiales'/source['archivo']).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == source['sha256'], source['archivo']
          files = []
          banned = {'.env','.git','.venv','__pycache__','.ipynb_checkpoints'}
          pattern = rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}'
          for folder in ['entrega_ml','data/capturas_oficiales','docs/evidencias_ml']:
              for path in sorted((root/folder).rglob('*')):
                  if not path.is_file(): continue
                  if path.is_symlink() or any(part in banned for part in path.relative_to(root).parts):
                      raise ValueError('Archivo no permitido: '+str(path))
                  if path.stat().st_size > 16_000_000 or path.suffix.lower() in {'.ttf','.otf','.woff','.woff2'}:
                      raise ValueError('Archivo no publicable: '+str(path))
                  data = path.read_bytes()
                  if re.search(pattern, data):
                      raise ValueError('Posible secreto: '+str(path))
                  files.append({'archivo':str(path.relative_to(root)), 'sha256':hashlib.sha256(data).hexdigest()})
          (root/'docs/evidencias_ml/manifest.json').write_text(json.dumps(files,indent=2))
          (root/'evidencia_publicacion/reutilizacion.json').write_text(json.dumps({
              'run_original':'42858124305','test_reevaluado':False,
              'originales_modificados':False,'archivos_verificados':len(files),'resultado':result},indent=2))
          print(json.dumps(result,indent=2))
          print('El test NO se ha reevaluado; originales conservados byte a byte.')
          PY
      - name: Publicar solo la evidencia en dev-jon con avance seguro
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/dev-jon
          current=$(git ls-remote origin refs/heads/dev-jon | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'La rama ha avanzado. Se conserva el artefacto, sin forzar ni sobrescribir cambios.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f entrega_ml data/capturas_oficiales docs/TEST_FINAL_EMAL.json docs/evidencias_ml
          # Los originales publicos se conservan, incluso sus espacios y codificacion.
          git diff --cached --check -- docs/TEST_FINAL_EMAL.json 'docs/evidencias_ml/*.json'
          if git diff --cached --quiet; then
            echo 'Los mismos artefactos ya estan publicados; no se crea un commit vacio.'
          else
            git commit -m 'data(ml): conservar modelo, test final unico, fuentes y capturas verificadas'
            auth=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w 0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/dev-jon
          fi
          git rev-parse HEAD > evidencia_publicacion/commit_publicado.txt
      - name: Conservar entrega y evidencia de publicacion
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: entrega-ml-final
          path: |
            evidencia_publicacion/
            docs/TEST_FINAL_EMAL.json
            docs/evidencias_ml/
            entrega_ml/
            data/capturas_oficiales/
          include-hidden-files: true
          retention-days: 30
