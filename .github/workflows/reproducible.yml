name: Entorno reproducible

"on":
  push:
    branches: [dev-jon]
    paths: ['.github/workflows/reproducible.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r requirements-ci.txt
      - name: Validar suite actual
        run: python -m pytest tests/ -q
      - name: Preparar copia reproducible sin credenciales
        run: |
          mkdir -p reproducible/wheels
          git archive --format=zip HEAD -o reproducible/codigo.zip
          git rev-parse HEAD > reproducible/commit.txt
          python -m pip download --only-binary=:all: --platform manylinux2014_x86_64 --python-version 313 --implementation cp --abi cp313 --dest reproducible/wheels -r requirements-ci.txt 'mlflow-skinny>=2.17,<3'
          cd reproducible
          sha256sum codigo.zip wheels/* > SHA256SUMS
      - name: Conservar codigo y dependencias publicas
        uses: actions/upload-artifact@v4
        with:
          name: entorno-reproducible
          path: reproducible/
          retention-days: 7
