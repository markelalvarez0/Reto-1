name: Captura trazable de fuentes oficiales
"on":
  push:
    branches: [dev-jon]
    paths: ['scripts/capture_sources.py', '.github/workflows/capture-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/capture_sources.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: fuentes-oficiales-originales
          path: data/capturas_oficiales/
          retention-days: 30
