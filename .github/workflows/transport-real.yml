name: HDFS y Kafka reales
"on":
  push:
    branches: [dev-jon, test, main]
    paths: ['infra/**','integration_tests/test_transport_live.py','.github/workflows/transport-real.yml','src/hdfs/**','src/kafka/**']
  pull_request:
    branches: [test, main]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
      kafka:
        image: apache/kafka:3.9.1
        ports: ['9092:9092']
    env:
      TRANSPORT_LIVE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: python -m pip install -r requirements-ci.txt
      - name: Levantar HDFS temporal y verificar distribucion
        run: bash infra/start_hdfs_ci.sh
      - name: Probar recuperacion y entrega a MongoDB
        run: |
          mkdir -p test-results
          python -m pytest integration_tests/test_transport_live.py -q --junitxml=test-results/transport-live.xml
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: evidencias-transporte-real
          path: test-results/
          retention-days: 30
