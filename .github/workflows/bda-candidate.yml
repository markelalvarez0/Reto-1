name: BDA capturas oficiales de extremo a extremo

"on":
  push:
    branches: [dev-jon, test, main]
    paths:
      - '.github/workflows/bda-candidate.yml'
      - 'src/extraction/**'
      - 'src/database/**'
      - 'src/hdfs/**'
      - 'src/kafka/**'
      - 'src/municipal_analysis.py'
      - 'src/ml_data.py'
      - 'app/territorio.py'
      - 'scripts/analyze_municipal.py'
      - 'scripts/transport_municipal.py'
      - 'scripts/audit_project.py'
      - 'scripts/run_pipeline.py'
      - 'scripts/capture_emal_api.py'
      - 'scripts/transport_rent_api.py'
      - 'data/capturas_api_rentas/**'
      - 'scripts/sync_sources.py'
      - 'BDA + SBD/main.py'
      - 'tests/**'
      - 'integration_tests/**'
      - 'data/capturas_oficiales/**'
      - 'infra/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/evidencias_ml/**'
      - 'docs/TEST_FINAL_EMAL.json'
      - 'entrega_ml/**'
      - '.gitattributes'
  pull_request:
    branches: [dev-jon, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bda-verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
      kafka:
        image: apache/kafka:3.9.1
        ports: ['9092:9092']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      BDA_LIVE: '1'
      TRANSPORT_LIVE: '1'
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Instalar dependencias con reintentos limitados
        run: |
          mkdir -p evidencia_bda_integracion
          installed=0
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -q -r requirements-ci.txt; then
              installed=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          test "$installed" = 1
          python -m pip check
          python -m pip freeze > evidencia_bda_integracion/entorno.txt
      - name: Probar el codigo publicado y las capturas de un checkout limpio
        run: |
          python -m pytest tests/ -q --junitxml=evidencia_bda_integracion/tests.xml
          python scripts/sync_sources.py --check
          python scripts/audit_project.py
          python "BDA + SBD/main.py" --prepare-only --raw-dir "$RUNNER_TEMP/bda_prepared"
          git diff --exit-code
      - name: Levantar HDFS real con distribucion verificada
        run: bash infra/start_hdfs_ci.sh
      - name: Probar transporte y fuentes oficiales con los tres servicios reales
        run: |
          python -m pytest integration_tests/test_transport_live.py integration_tests/test_bda_sources_live.py integration_tests/test_municipal_live.py integration_tests/test_municipal_transport_live.py -q -s --junitxml=evidencia_bda_integracion/integracion.xml
      - name: Exportar analisis municipal con MongoDB real
        run: |
          python scripts/analyze_municipal.py --db-name "reto1_municipal_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --output-dir evidencia_bda_integracion/municipal
          python scripts/transport_municipal.py --input-dir evidencia_bda_integracion/municipal --db-name "reto1_municipal_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --report evidencia_bda_integracion/transporte_municipal.json
          python scripts/audit_project.py
      - name: Transportar y contrastar la muestra archivada de anuncios reales
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          shutil.copytree('data/capturas_anuncios/2026-11-12', Path(os.environ['RUNNER_TEMP'])/'anuncios_archivados')
          PY
          python scripts/run_pipeline.py --snapshot-dir data/capturas_oficiales --raw-dir "$RUNNER_TEMP/anuncios_archivados" --output-dir evidencia_bda_integracion/pipeline_anuncios --db-name "reto1_anuncios_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          python scripts/analyze_rental_sample.py --capture-dir data/capturas_anuncios/2026-11-12 --pipeline-dir evidencia_bda_integracion/pipeline_anuncios --db-name "reto1_anuncios_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --output-dir evidencia_bda_integracion/anuncios
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidencia_bda_integracion')
          pipeline = json.loads((root/'pipeline_anuncios/manifest.json').read_text())
          sample = json.loads((root/'anuncios/resumen.json').read_text())
          assert pipeline['por_tipo_registro'] == {'promocion': 621, 'anuncio': 17}
          assert pipeline['anuncios_publicados'] == pipeline['anuncios_recibidos'] == pipeline['registros_persistidos'] == 638
          assert sample['reentrega'] == {'antes': 638, 'despues': 638, 'duplicados_nuevos': 0}
          assert sample['consultas']['alquileres_bilbao'] == 6
          assert sample['consultas']['senal_temporal_en_array'] == 3
          assert len(sample['comparativa']) == 3 and sample['atomicidad']['contador_final'] == 100
          PY
          python scripts/audit_project.py
          git diff --exit-code
      - name: API de rentas monetarias conservada y transporte real separado
        run: |
          python scripts/transport_rent_api.py --input-dir data/capturas_api_rentas/2026-11-12 --db-name "reto1_api_${GITHUB_RUN_ID}" --report evidencia_bda_integracion/api-primera.json
          python scripts/transport_rent_api.py --input-dir data/capturas_api_rentas/2026-11-12 --db-name "reto1_api_${GITHUB_RUN_ID}" --report evidencia_bda_integracion/api-reentrega.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          report=json.loads(Path('evidencia_bda_integracion/api-reentrega.json').read_text())
          assert report['recibidos']==report['documentos_coleccion']==3
          assert report['offsets_tras_persistencia']
          PYCODE
      - name: Comprobar resultados sin publicar ni modificar ramas
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder = Path('evidencia_bda_integracion')
          report = json.loads((folder/'resumen.json').read_text(encoding='utf-8'))
          counts = {}
          for name in ('tests.xml', 'integracion.xml'):
              suites = ET.parse(folder/name).getroot().findall('testsuite')
              if not suites:
                  raise RuntimeError('No hay resultados de pytest')
              for suite in suites:
                  if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
                      raise RuntimeError('La validacion debe terminar sin fallos ni pruebas omitidas')
              counts[name] = sum(int(s.get('tests', '0')) for s in suites)
              if not counts[name]:
                  raise RuntimeError('La suite no ejecuto pruebas')
          cases = ET.parse(folder/'integracion.xml').getroot().findall('.//testcase')
          if not any(c.get('name') == 'test_municipal_analysis_live' for c in cases):
              raise RuntimeError('No se ejecuto la integracion municipal')
          if not any(c.get('name') == 'test_municipal_views_cross_real_services' for c in cases):
              raise RuntimeError('No se ejecuto el transporte municipal')
          municipal = folder/'municipal'
          manifest = json.loads((municipal/'manifest.json').read_text(encoding='utf-8'))
          if {item['archivo'] for item in manifest} != {'comparativa_municipal.json', 'resumen_territorial.json', 'serie_trimestral.json', 'mapa_promociones.json', 'metadatos.json'}:
              raise RuntimeError('Faltan resultados municipales')
          for item in manifest:
              if hashlib.sha256((municipal/item['archivo']).read_bytes()).hexdigest() != item['sha256']:
                  raise RuntimeError('Huella municipal incorrecta')
          metadata = json.loads((municipal/'metadatos.json').read_text(encoding='utf-8'))
          comparison = json.loads((municipal/'comparativa_municipal.json').read_text(encoding='utf-8'))
          if metadata['motor'] != 'MongoDB' or len(comparison) != 18:
              raise RuntimeError('Se exige MongoDB real y 18 municipios')
          transport = json.loads((folder/'transporte_municipal.json').read_text(encoding='utf-8'))
          if set(transport['servicios'].values()) != {'real'} or transport['recibidos'] != 5:
              raise RuntimeError('Transporte municipal incompleto')
          report['analisis_municipal'] = {'motor': metadata['motor'], 'municipios': len(comparison),
              'manifest': 'municipal/manifest.json', 'transportado_por_hdfs_kafka': True,
              'evidencia_transporte': 'transporte_municipal.json'}
          report.update(pruebas=counts, commit_validado=os.environ['GITHUB_SHA'],
                        checkout_limpio=True, propuesta_temporal=False,
                        publica_codigo=False, reentrena_modelos=False)
          (folder/'resumen.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k: v for k, v in report.items() if k not in {'originales', 'hdfs', 'promociones_por_municipio_y_fuente', 'rechazos_preparacion'}}, ensure_ascii=False, indent=2))
          PY
          git diff --exit-code
      - name: Conservar evidencias incluso ante fallos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bda-checkout-limpio
          path: |
            evidencia_bda_integracion/
            test-results/
          retention-days: 30
