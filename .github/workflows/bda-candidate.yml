name: BDA capturas oficiales de extremo a extremo

"on":
  push:
    branches: [dev-jon, test, main]
    paths:
      - '.github/workflows/bda-candidate.yml'
      - 'src/extraction/**'
      - 'src/database/**'
      - 'src/hdfs/**'
      - 'src/kafka/**'
      - 'scripts/run_pipeline.py'
      - 'scripts/sync_sources.py'
      - 'BDA + SBD/main.py'
      - 'tests/**'
      - 'integration_tests/**'
      - 'data/capturas_oficiales/**'
      - 'infra/**'
      - 'requirements*.txt'
      - '.gitattributes'
  pull_request:
    branches: [dev-jon, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bda-verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
      kafka:
        image: apache/kafka:3.9.1
        ports: ['9092:9092']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      BDA_LIVE: '1'
      TRANSPORT_LIVE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Instalar dependencias con reintentos limitados
        run: |
          mkdir -p evidencia_bda_integracion
          installed=0
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -q -r requirements-ci.txt; then
              installed=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          test "$installed" = 1
          python -m pip check
          python -m pip freeze > evidencia_bda_integracion/entorno.txt
      - name: Probar el codigo publicado y las capturas de un checkout limpio
        run: |
          python -m pytest tests/ -q --junitxml=evidencia_bda_integracion/tests.xml
          python scripts/sync_sources.py --check
          python "BDA + SBD/main.py" --prepare-only --raw-dir "$RUNNER_TEMP/bda_prepared"
          git diff --exit-code
      - name: Levantar HDFS real con distribucion verificada
        run: bash infra/start_hdfs_ci.sh
      - name: Probar transporte y fuentes oficiales con los tres servicios reales
        run: |
          python -m pytest integration_tests/test_transport_live.py integration_tests/test_bda_sources_live.py -q -s --junitxml=evidencia_bda_integracion/integracion.xml
      - name: Comprobar resultados sin publicar ni modificar ramas
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder = Path('evidencia_bda_integracion')
          report = json.loads((folder/'resumen.json').read_text(encoding='utf-8'))
          counts = {}
          for name in ('tests.xml', 'integracion.xml'):
              suites = ET.parse(folder/name).getroot().findall('testsuite')
              if not suites:
                  raise RuntimeError('No hay resultados de pytest')
              for suite in suites:
                  if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
                      raise RuntimeError('La validacion debe terminar sin fallos ni pruebas omitidas')
              counts[name] = sum(int(s.get('tests', '0')) for s in suites)
          report.update(pruebas=counts, commit_validado=os.environ['GITHUB_SHA'],
                        checkout_limpio=True, propuesta_temporal=False,
                        publica_codigo=False, reentrena_modelos=False)
          (folder/'resumen.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k: v for k, v in report.items() if k not in {'originales', 'hdfs', 'promociones_por_municipio_y_fuente', 'rechazos_preparacion'}}, ensure_ascii=False, indent=2))
          PY
          git diff --exit-code
      - name: Conservar evidencias incluso ante fallos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bda-checkout-limpio
          path: |
            evidencia_bda_integracion/
            test-results/
          retention-days: 30
