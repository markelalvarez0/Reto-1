name: Validacion de propuesta ML

"on":
  push:
    branches: [dev-jon]
    paths: ['.github/workflows/ml-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '42'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar version publicada sin cambios
        run: |
          mkdir -p test-results
          python -m pip install -r requirements-ci.txt
          python -m pytest tests/ -q --junitxml=test-results/base.xml
      - name: Aplicar propuesta solo al runner y verificar objetos Git
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          from urllib.request import Request, urlopen

          tree_sha = '7d69eaa453744eff38818ddf0d1e5b3fdaaf8756'
          api = 'https://api.github.com/repos/markelalvarez0/Reto-1/git/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              with urlopen(Request(api + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          tree = get('trees/' + tree_sha + '?recursive=1')
          if tree.get('truncated') or tree.get('sha') != tree_sha:
              raise RuntimeError('Arbol incompleto o identidad incorrecta')
          root = Path.cwd().resolve()
          allowed = {'src', 'tests', 'scripts', 'notebooks', 'app', 'docs', 'SAA + PIA + MIA'}
          downloads = []
          for entry in tree['tree']:
              if entry['type'] == 'tree':
                  continue
              path = PurePosixPath(entry['path'])
              if entry['type'] != 'blob' or entry['mode'] != '100644' or path.is_absolute() or '..' in path.parts:
                  raise ValueError('Entrada no permitida: ' + str(path))
              if path.parts[0] not in allowed and str(path) not in {'requirements.txt', 'pyproject.toml'}:
                  raise ValueError('Ruta fuera de la propuesta: ' + str(path))
              target = root.joinpath(*path.parts)
              if not target.resolve().is_relative_to(root) or target.is_symlink():
                  raise ValueError('Ruta no segura: ' + str(path))
              blob = get('blobs/' + entry['sha'])
              if blob.get('encoding') != 'base64' or blob.get('size', 0) > 2000000:
                  raise ValueError('Objeto inesperado')
              data = base64.b64decode(blob['content'])
              digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if digest != entry['sha']:
                  raise ValueError('Identidad de blob incorrecta: ' + str(path))
              downloads.append((target, data, entry))
          for target, data, entry in downloads:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          manifest = {'base_commit': os.environ['GITHUB_SHA'], 'overlay_tree': tree_sha,
                      'files': [{'path': item[2]['path'], 'blob_sha': item[2]['sha']} for item in downloads],
                      'publicado_en_rama': False}
          Path('test-results/propuesta.json').write_text(json.dumps(manifest, indent=2))
          print('Propuesta verificada:', len(downloads), 'archivos; sin commits ni cambios remotos')
          PY
          python scripts/sync_sources.py
          python scripts/sync_sources.py --check
      - name: Instalar librerias estandar de la propuesta
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
          python -m pip freeze > test-results/entorno-ml.txt
      - name: Ejecutar suite completa con la propuesta
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q --junitxml=test-results/propuesta.xml 2>&1 | tee test-results/propuesta.log
      - name: Recuperar originales oficiales de la captura verificada
        uses: actions/download-artifact@v4
        with:
          name: fuentes-oficiales-originales
          run-id: 42835919323
          github-token: ${{ github.token }}
          path: data/capturas_oficiales
      - name: Entrenar y explicar sin evaluar el test reservado
        shell: bash
        run: |
          set -o pipefail
          python scripts/train_official.py --raw data/capturas_oficiales --output entrega_ml 2>&1 | tee test-results/entrenamiento.log
      - name: Conservar evidencias aunque falle la propuesta
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validacion-propuesta-ml
          path: |
            test-results/
            entrega_ml/
          retention-days: 30
