name: Pruebas Reto 1

"on":
  push:
    branches:
      - fix/ine-integridad-pendiente-tests
  pull_request:
    branches: [dev-jon, test, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Suite pytest - Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Registrar entorno
        run: |
          mkdir -p test-results
          python --version > test-results/entorno.txt
          python -m pip freeze >> test-results/entorno.txt

      - name: Ejecutar suite completa
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log

      - name: Conservar resultados incluso si fallan pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pytest
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
