# Servicios docentes locales; no se exponen a Internet ni envian correo.
services:
  acciones:
    image: python:3.12-slim
    command: ['python', '/app/action_server.py', '--host', '0.0.0.0', '--output', '/salida']
    volumes:
      - ../scripts/action_server.py:/app/action_server.py:ro
      - ../data/acciones_n8n:/salida
  n8n:
    image: n8nio/n8n:2.47.3
    ports: ['127.0.0.1:5678:5678']
    volumes:
      - n8n_data:/home/node/.n8n
      - ./flujo.json:/workflow/flujo.json:ro
    environment:
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_SECURE_COOKIE: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      # El receptor pertenece a esta red Compose, no al proxy de Internet.
      NO_PROXY: '${NO_PROXY:-localhost,127.0.0.1},acciones,n8n'
      no_proxy: '${no_proxy:-localhost,127.0.0.1},acciones,n8n'
    depends_on: [acciones]
volumes:
  n8n_data:
